name: 1 - Generate Script & Images

on:
  schedule:
    - cron: "0 9 * * 1,3,5"  # 3x/week: Mon, Wed, Fri at 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/generate_script.py

      - name: Clear old slides
        run: |
          rm -rf data/slides
          mkdir -p data/slides

      - name: Generate images (Pollinations)
        env:
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
        run: python scripts/fetch_images.py

      - name: Compose thumbnail text
        run: python scripts/compose_thumbnail.py

      - name: Commit script + images
        run: |
          git config user.name "youtube-story-agent"
          git config user.email "actions@github.com"
          git add data/script.json data/slides
          git commit -m "New script + images: $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push

      - name: Read script title
        id: title
        run: echo "title=$(python -c "import json; print(json.load(open('data/script.json'))['title'])")" >> "$GITHUB_OUTPUT"

      - name: Open review issue
        uses: actions/github-script@v7
        with:
          script: |
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const thumbUrl = `https://raw.githubusercontent.com/${repo}/main/data/slides/thumbnail.png`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Ready to review: ${{ steps.title.outputs.title }}`,
              body: `Script + images have been generated automatically.\n\n**Thumbnail preview:**\n![thumbnail](${thumbUrl})\n\nTake a quick look through \`data/slides/\` to make sure the images look right (Pollinations quality can vary).\n\nIf it looks good: **Actions tab → "2 - Assemble & Publish Video" → Run workflow.**\n\nIf the images look off, you can re-run **"1 - Generate Script & Images"** to try again with a new script, or manually replace any bad images in \`data/slides/\` before running step 2.`
            });
